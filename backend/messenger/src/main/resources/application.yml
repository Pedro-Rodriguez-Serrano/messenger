spring:
  config:
    import: optional:file:../../.env[.properties]
  application:
    name: messenger
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      ttl-seconds: 900