openapi: 3.0.3
info:
  title: Messenger API
  version: 1.1.0
  description: API del messenger. Módulos incluidos identidad (registro, login, usuario actual) y contactos (amigos y solicitudes).

servers:
  - url: http://localhost:8080

tags:
  - name: auth
    description: Registro y autenticación
  - name: contacts
    description: Amigos y solicitudes de amistad

paths:
  /api/v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Crea una cuenta nueva y devuelve una sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Cuenta creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Username o email ya en uso
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Inicia sesión con username o email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Credenciales incorrectas (no distingue usuario inexistente de contraseña errónea)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/users/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: Devuelve el usuario autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuario actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/contacts:
    get:
      tags: [contacts]
      operationId: listContacts
      summary: Lista mis amigos (solicitudes aceptadas)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de amigos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contact'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/contacts/requests:
    get:
      tags: [contacts]
      operationId: listContactRequests
      summary: Lista solicitudes pendientes
      security:
        - bearerAuth: []
      parameters:
        - name: direction
          in: query
          required: true
          schema:
            type: string
            enum: [incoming, outgoing]
      responses:
        '200':
          description: Solicitudes pendientes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContactRequest'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [contacts]
      operationId: sendContactRequest
      summary: Envía una solicitud de amistad por username
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
                  example: pepe
      responses:
        '201':
          description: Solicitud creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactRequest'
        '400':
          description: Datos inválidos o solicitud a uno mismo
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No existe ese usuario
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Ya sois amigos o ya hay una solicitud pendiente entre vosotros
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/contacts/requests/{requestId}/accept:
    post:
      tags: [contacts]
      operationId: acceptContactRequest
      summary: Acepta una solicitud recibida
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Solicitud aceptada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: La solicitud no va dirigida a ti
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: La solicitud no existe
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/contacts/requests/{requestId}:
    delete:
      tags: [contacts]
      operationId: deleteContactRequest
      summary: Rechaza una solicitud recibida o cancela una enviada
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '204':
          description: Solicitud eliminada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: No participas en esa solicitud
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: La solicitud no existe
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/contacts/{userId}:
    delete:
      tags: [contacts]
      operationId: removeContact
      summary: Elimina a un amigo
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Amigo eliminado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No sois amigos
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    ValidationError:
      description: Datos de entrada inválidos
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Token ausente, inválido o caducado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    RegisterRequest:
      type: object
      required: [username, email, password, displayName]
      properties:
        username:
          type: string
          pattern: '^[a-z0-9_.]{3,30}$'
          example: ana_92
          description: Minúsculas, números, punto y guion bajo. No cambia después.
        email:
          type: string
          format: email
          maxLength: 254
          example: ana@mail.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
        displayName:
          type: string
          minLength: 1
          maxLength: 50
          example: "~*Ana*~"

    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: Username o email
          example: ana_92
        password:
          type: string
          format: password

    AuthResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          description: Segundos hasta que caduca el token
          example: 900
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      required: [id, username, displayName, createdAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
          description: Solo se devuelve al propio usuario
        displayName:
          type: string
        personalMessage:
          type: string
          nullable: true
          maxLength: 150
        avatarUrl:
          type: string
          nullable: true
          maxLength: 500
          description: URL de la foto de perfil. Si es nula, el cliente muestra un avatar por defecto.
        createdAt:
          type: string
          format: date-time

    UserSummary:
      type: object
      description: Datos públicos de un usuario (sin email)
      required: [id, username, displayName]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        personalMessage:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true

    Contact:
      type: object
      required: [user, since]
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'
        since:
          type: string
          format: date-time
          description: Fecha en que se aceptó la amistad

    ContactRequest:
      type: object
      required: [id, user, createdAt]
      properties:
        id:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/UserSummary'
          description: La otra persona (quien envía si es entrante, quien recibe si es saliente)
        createdAt:
          type: string
          format: date-time

    Problem:
      type: object
      description: Formato Problem Details (RFC 9457)
      required: [type, title, status]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Validation failed
        status:
          type: integer
          example: 400
        detail:
          type: string
        errors:
          type: array
          description: Errores por campo (solo en validación)
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string